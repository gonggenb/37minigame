<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二批战斗特效 · 八版方向</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121819;color:#e9dfc3;font:15px/1.6 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:28px}h1{font-size:28px;margin:0}p{color:#aab4ae;margin:6px 0 20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#1d2728;border:1px solid #46524b;text-align:left;color:inherit;padding:12px;cursor:pointer;position:relative}.card.selected{border-color:#d1aa5a;background:#28312d}.card img{width:100%;height:180px;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#172020 0% 25%,#1c2626 0% 50%) 50%/24px 24px}.card strong{display:block;font-size:16px}.card small{color:#aab4ae}.tag{position:absolute;right:18px;top:18px;color:#d1aa5a;background:#121819;padding:2px 7px;font-size:12px}.controls{display:flex;gap:20px;align-items:center;margin:28px 0 14px;flex-wrap:wrap}select{background:#27322c;color:#e9dfc3;padding:8px;border:1px solid #687563}label{display:flex;gap:9px;align-items:center}.views{display:grid;grid-template-columns:minmax(0,960px) minmax(220px,360px);gap:20px;align-items:start}.scene{position:relative;width:100%;overflow:hidden;background:#000}.scene .bg{width:100%;display:block}.effect{position:absolute;image-rendering:pixelated;object-fit:contain;transform:translate(-50%,-50%);pointer-events:none}.caption{color:#aab4ae;font-size:13px}#detail{max-width:850px;color:#d2d7cc}a{color:#d1aa5a}footer{margin-top:28px;color:#84938b;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.views{grid-template-columns:1fr}.card img{height:140px}}
</style><main><h1>战斗特效 · 四类八版</h1><p>静态合成方向预览 · 使用真实游戏截图作为底图 · 尚未制作动画或接入 Unity</p><section class="grid" id="cards"></section><div class="controls"><strong id="selection"></strong><label>预览尺寸 <input id="scale" type="range" min="72" max="200" step="4" value="128"><output id="px">128 px</output></label><label><input type="checkbox" id="visible" checked>显示特效</label></div><p id="detail"></p><section class="views"><div><div class="scene" id="landscape"><img class="bg" src="references/landscape.png"><img class="effect"></div><div class="caption">横屏底图 960 × 540；预览中的位置表示设计落点，不代表已完成触发绑定。</div></div><div><div class="scene" id="portrait"><img class="bg" src="references/portrait.png"><img class="effect"></div><div class="caption">竖屏底图 540 × 960；可拖动尺寸滑块检查轮廓。</div></div></section><footer>Generated / Composition Preview · PNG 原图保存在 raw/ · 完整生成提示词见 <a href="prompts.json">prompts.json</a> · 制作说明见 <a href="README.md">README.md</a></footer></main>
<script>
const variants=[
 ['A1_armor_pierce','A1 · 碎金穿劲','破甲 / 窄劲穿透','穿透劲气与少量碎甲集中在接触点。'],
 ['A2_armor_crush','A2 · 震甲裂纹','破甲 / 壳体崩裂','留空中心的碎裂护甲轮廓，强调减防结果。'],
 ['B1_swift_swallow','B1 · 双燕追锋','连击 / 前后双刃','两道剑气前后追击，动画应错开命中节奏。'],
 ['B2_swift_scissor','B2 · 回锋剪影','连击 / 折返双弧','短曲线交错，强调局部连斩，避免大叉号。'],
 ['C1_retaliation_wave','C1 · 金钟回波','反震 / 护环回弹','护环受压后，短波从玩家一侧弹回对手。'],
 ['C2_retaliation_petals','C2 · 护罡折返','反震 / 分层气甲','薄气甲向前弹出，保留中心透明空间。'],
 ['D1_lifesteal_beads','D1 · 赤玉归元','吸血 / 光点回流','能量从敌人回到玩家；这是朝左的回流效果。'],
 ['D2_lifesteal_silk','D2 · 引血回丝','吸血 / 双丝内收','红玉双丝回收，最终收于玩家胸腹。']
];
let selected=0;const cards=document.querySelector('#cards');
variants.forEach((v,i)=>{let b=document.createElement('button');b.className='card';b.innerHTML=`<img src="raw/${v[0]}.png" alt="${v[1]}">${[0,2,4,6].includes(i)?'<span class="tag">优先制作</span>':''}<strong>${v[1]}</strong><small>${v[2]}</small>`;b.onclick=()=>{selected=i;update()};cards.appendChild(b)});
function update(){let v=variants[selected];document.querySelectorAll('.card').forEach((e,i)=>e.classList.toggle('selected',i===selected));document.querySelector('#selection').textContent=v[1];document.querySelector('#detail').textContent=v[3];let s=+document.querySelector('#scale').value;document.querySelector('#px').textContent=s+' px';for(let portrait of [false,true]){let el=document.querySelector(portrait?'#portrait .effect':'#landscape .effect');let w=portrait?540:960;let h=portrait?960:540;let x=portrait?398:674,y=portrait?500:381;if(selected>=4&&selected<6){x=portrait?192:369;y=portrait?508:392}if(selected>=6){x=portrait?240:459;y=portrait?500:389}el.src='raw/'+v[0]+'.png';el.style.width=(s*(selected>=6?1.5:1)/w*100)+'%';el.style.left=(x/w*100)+'%';el.style.top=(y/h*100)+'%';el.style.display=document.querySelector('#visible').checked?'block':'none';}}
document.querySelector('#scale').oninput=update;document.querySelector('#visible').onchange=update;update();
</script></html>
