<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>37minigame</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0e0c09;
      }
      #unity-container {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        background: #0e0c09;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #1F1F20;
        outline: none;
      }
      #unity-loading {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(58vw, 320px);
        height: 4px;
        transform: translate(-50%, -50%);
        border: 1px solid #8d7040;
        background: #17130f;
      }
      #unity-progress {
        width: 0;
        height: 100%;
        background: #c5a15d;
      }
      #unity-warning {
        position: absolute;
        z-index: 2;
        top: 0;
        left: 0;
        right: 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
      <div id="unity-loading"><div id="unity-progress"></div></div>
      <div id="unity-warning"></div>
    </main>
    <script src="Build/WebGL Builds.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      const progress = document.querySelector("#unity-progress");
      const warning = document.querySelector("#unity-warning");

      function showBanner(message, type) {
        const row = document.createElement("div");
        row.textContent = message;
        row.style.cssText = "padding:8px;color:#f3e7c9;background:" +
          (type === "error" ? "#6d211b" : "#5a4725");
        warning.appendChild(row);
        if (type !== "error") setTimeout(() => row.remove(), 5000);
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL Builds.data.unityweb",
        frameworkUrl: "Build/WebGL Builds.framework.js.unityweb",
        codeUrl: "Build/WebGL Builds.wasm.unityweb",
        symbolsUrl: "Build/WebGL Builds.symbols.json.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "37minigame",
        productVersion: "1.0",
        showBanner,
      }, value => {
        progress.style.width = (value * 100) + "%";
      }).then(() => {
        loading.remove();
      }).catch(message => {
        loading.remove();
        showBanner(message, "error");
      });
    </script>
  </body>
</html>
